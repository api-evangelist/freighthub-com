tags:
- name: Reports
paths:
  /v1/reports/{templateId}/{reportId}:
    get:
      operationId: downloadReportv1
      parameters:
      - name: templateId
        required: true
        in: path
        description: Template ID
        schema:
          type: string
      - name: reportId
        required: true
        in: path
        description: 'Report ID '
        schema:
          type: string
      responses:
        '200':
          description: File stream response
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIValidationError'
        '401':
          description: Authorization failed for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthenticationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthorizationError'
        '404':
          description: Requested resource cannot be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APINotFoundError'
        default:
          description: Default Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - Authorization: []
      summary: Download a report
      tags:
      - Reports
