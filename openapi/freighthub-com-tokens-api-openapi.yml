openapi: 3.2.0
info:
  title: Forto Platform Tokens API
  description: Public API schema
  version: '1.0'
  contact:
    name: Customer Integrations Team
    url: ''
    email: ''
servers:
- url: https://public-api.forto.io
  description: Our Sandbox API
- url: https://public-api.forto.com
  description: Our Production API
tags:
- name: Tokens
paths:
  /v1/tokens:
    post:
      operationId: createTokenv1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerTokenBody'
      responses:
        '201':
          description: ''
      security:
      - Authorization: []
      summary: Create a Token
      tags:
      - Tokens
    get:
      operationId: getTokensv1
      parameters:
      - name: pageSize
        required: false
        in: query
        description: Desired amount of entities in the response
        schema:
          minimum: 1
          maximum: 50
          default: 50
          type: number
      - name: page
        required: false
        in: query
        description: Desired page of entities
        schema:
          minimum: 1
          default: 1
          type: number
      responses:
        '200':
          description: Returns a list of tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerTokensResponse'
      security:
      - Authorization: []
      summary: Paginate/List Tokens
      tags:
      - Tokens
  /v1/tokens/{id}:
    delete:
      operationId: deleteTokenv1
      parameters:
      - name: id
        required: true
        in: path
        description: ID of the entity
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
      security:
      - Authorization: []
      summary: Delete a Token
      tags:
      - Tokens
components:
  schemas:
    GetCustomerTokensResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        totalItems:
          type: number
          minimum: 0
          description: Total number of items found
        page:
          type: number
          minimum: 1
          description: Current page number
        pageSize:
          type: number
          minimum: 1
          description: Requested size of the page
      required:
      - items
      - totalItems
      - page
      - pageSize
    Token:
      type: object
      properties:
        id:
          type: string
          description: The ID of the token
        name:
          type: string
          description: The name assigned to the token
        createdAt:
          format: date-time
          type: string
          description: The date the token was created
        token:
          type: string
          description: The hashed token value
        lastUsedAt:
          format: date-time
          type: string
          description: The date the token was last used
      required:
      - id
      - createdAt
      - token
    CreateCustomerTokenBody:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          default: true
          description: OK response
      required:
      - ok
  securitySchemes:
    Authorization:
      scheme: bearer
      bearerFormat: Forto API Key Format
      type: http
      description: API Key
