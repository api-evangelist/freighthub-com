components:
  schemas:
    ShipmentDocuments:
      type: object
      properties:
        shipmentId:
          type: string
          description: ID of the shipment
        customerReference:
          type:
          - string
          - 'null'
          description: Reference given to the shipment by the customer
        documents:
          description: Documents of the shipment
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDocument'
      required:
      - shipmentId
      - customerReference
      - documents
    TransportPlanSegmentAddressDepot:
      type: object
      properties:
        fullString:
          type: string
          description: The full address in string format
        streetNumber:
          type: string
          description: Street number
        street:
          type: string
          description: Street
        district:
          type: string
          description: District
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        country:
          type: string
          description: Country
        countryCode:
          type: string
          description: Country code
        postalCode:
          type: string
          description: Postal code
        type:
          type: string
          description: Depot
        name:
          type: string
          description: Name of the depot
      required:
      - fullString
      - streetNumber
      - street
      - district
      - city
      - state
      - country
      - countryCode
      - postalCode
      - type
    ShipmentInvoice:
      type: object
      properties:
        invoiceNumber:
          type: string
        invoiceType:
          enum:
          - creditNote
          - freight
          - customs
          - transport
          - additionalCharges
          type: string
        status:
          enum:
          - Cancelled
          - Outstanding
          - Overdue
          - Paid
          - Cleared
          type: string
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentInvoiceLineItem'
        issueDate:
          type: string
          format: date-time
        netAmount:
          $ref: '#/components/schemas/ShipmentInvoiceMoney'
        grossAmount:
          $ref: '#/components/schemas/ShipmentInvoiceMoney'
        vatAmount:
          $ref: '#/components/schemas/ShipmentInvoiceMoney'
        link:
          type: string
          description: Download link for the document
        linkValidUntil:
          type: string
          description: Time that this download link is valid for downloading. Requesting again will generate another download link.
          format: date-time
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
          description: Only defined if invoice is not paid
        dueAmount:
          description: Only defined if invoice is not paid
          allOf:
          - $ref: '#/components/schemas/ShipmentInvoiceMoney'
      required:
      - invoiceNumber
      - invoiceType
      - status
      - lineItems
      - issueDate
      - netAmount
      - grossAmount
      - vatAmount
      - link
      - linkValidUntil
    ShipmentInvoices:
      type: object
      properties:
        shipmentId:
          type: string
          description: ID of the shipment
        customerReference:
          type:
          - string
          - 'null'
          description: Reference given to the shipment by the customer
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentInvoice'
      required:
      - shipmentId
      - customerReference
      - invoices
    TransportPlanV1:
      type: object
      properties:
        cargoReady:
          description: Status of cargo ready milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        departure:
          description: Status of departure milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        arrival:
          description: Status of arrival milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        pickup:
          description: Status of pickup milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        delivery:
          description: Status of delivery milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        containerGateIn:
          description: Status of container gate in milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        containerGateOut:
          description: Status of container gate out milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentArrival:
          description: Status of transshipment port arrival milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentDeparture:
          description: Status of transshipment port departure milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentArrival2:
          description: Status of second transshipment port arrival milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentDeparture2:
          description: Status of second transshipment port departure milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentArrival3:
          description: Status of third transshipment port arrival milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentDeparture3:
          description: Status of third transshipment port departure milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentArrival4:
          description: Status of fourth transshipment port arrival milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        transshipmentDeparture4:
          description: Status of fourth transshipment port departure milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        containerEmptyPickup:
          description: Status of container empty pickup milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        containerEmptyReturn:
          description: Status of container empty return milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        containerDischargedDestination:
          description: Status of container discharge at destination milestone
          allOf:
          - $ref: '#/components/schemas/TransportPlanStatus'
        customsStopOrigin:
