  /v1/shipments/{shipmentId}/documents/{role}/upload:
    post:
      operationId: uploadShipmentDocumentv1
      parameters:
      - name: role
        required: true
        in: path
        description: Document role
        schema:
          type: string
      - name: shipmentId
        required: true
        in: path
        description: ID of the Shipment
        schema:
          type: string
      requestBody:
        required: true
        description: Document to upload
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '204':
          description: ''
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
