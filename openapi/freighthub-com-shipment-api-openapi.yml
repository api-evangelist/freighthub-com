          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - Authorization: []
      summary: Upload a Document for a Shipment
      tags:
      - Shipment
  /v1/shipments/{shipmentId}/invoices:
    get:
      operationId: getShipmentInvoicesv1
      parameters:
      - name: shipmentId
        required: true
        in: path
        description: ID of the Shipment
        schema:
          type: string
      - name: startDate
        required: false
        in: query
        description: earliest invoice date (YYYY-MM-DD)
        schema:
          format: date
          type: string
      - name: endDate
        required: false
        in: query
        description: latest invoice date (YYYY-MM-DD)
        schema:
          format: date
          type: string
      responses:
