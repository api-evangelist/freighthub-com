openapi: 3.2.0
info:
  title: Forto Platform Shipment API
  description: Public API schema
  version: '1.0'
  contact:
    name: Customer Integrations Team
    url: ''
    email: ''
servers:
- url: https://public-api.forto.io
  description: Our Sandbox API
- url: https://public-api.forto.com
  description: Our Production API
tags:
- name: Shipment
paths:
  /shipments/{shipmentId}/transportPlan:
    get:
      deprecated: true
      operationId: getShipmentTransportPlan[0]
      parameters:
      - name: shipmentId
        required: true
        in: path
        description: ID of the Shipment
        schema:
          type: string
      responses:
        '200':
          description: Shipment Transport Plan Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentTransportPlanV1'
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIValidationError'
        '401':
          description: Authorization failed for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthenticationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthorizationError'
        '404':
          description: Requested resource cannot be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APINotFoundError'
        default:
          description: Default Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - Authorization: []
      summary: Get Transport Plan
      tags:
      - Shipment
  /v1/shipments:
    get:
      operationId: getShipmentsv1
      parameters:
      - name: _id
        required: false
        in: query
        description: ID of the shipment
        schema:
          type: string
      - name: customerReference
        required: false
        in: query
        description: Customer Reference of the shipment. Query is case insensitive and partial matches are supported.
        schema:
          type: string
      - name: states
        required: false
        in: query
        description: Shipment States
        schema:
          minItems: 1
          type: array
          items:
            type: string
            enum:
            - new
            - active
            - completed
            - canceled
            - closed
      - name: pageSize
        required: false
        in: query
        description: Desired amount of entities in the response
        schema:
          minimum: 1
          maximum: 50
          default: 50
          type: number
      - name: page
        required: false
        in: query
        description: Desired page of entities
        schema:
          minimum: 1
          default: 1
          type: number
      responses:
        '200':
          description: Paginated response of Shipments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListShipmentsResponse'
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIValidationError'
        '401':
          description: Authorization failed for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthenticationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIAuthorizationError'
        '404':
          description: Requested resource cannot be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APINotFoundError'
        default:
          description: Default Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - Authorization: []
      summary: List/Filter/Paginate Shipments
      tags:
      - Shipment
  /v1/shipments/{shipmentId}:
    get:
      operationId: getShipmentv1
      parameters:
      - name: shipmentId
        required: true
        in: path
        description: ID of the Shipment
        schema:
